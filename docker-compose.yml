version: '3.8'

services:
  db:
    image: postgres
    platform: linux/amd64
    environment:
      POSTGRES_USER: user
      POSTGRES_PASSWORD: password
      POSTGRES_DB: tasksdb
      LANG: en_US.UTF-8
      LC_ALL: en_US.UTF-8
      DB_DSN: "postgresql://user:password@db:5432/tasksdb?sslmode=disable"
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/dat
    healthcheck:
        test: ["CMD-SHELL", "pg_isready -U user -d tasksdb"]
        interval: 5s
        timeout: 5s
        retries: 10

  minio:
    image: minio/minio
    container_name: minio
    entrypoint: sh
    command: >
      -c 'mkdir -p /data/test-bucket && minio server /data'
    volumes:
      - ./minio-data:/data
    env_file:
      - .env
    ports:
      - 9000:9000
      - 9001:9001
    depends_on: 
      - db
      
  auth_service:
    build: 
      context: .
      dockerfile: auth-service/Dockerfile
    # environment:
    #   DB_DSN: "postgres://user:password@postgres:5432/tasksdb?sslmode=disable"
    ports:
     - "8080:8080"
    volumes:
     - ./.env:/app/.env
     - ./shared:/app/shared
     - ./auth-service/internal/migrations:/app/internal/migrations:ro
    depends_on:
      db:
        condition: service_healthy 
    # command: >

    restart: unless-stopped


