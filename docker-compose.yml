version: '3.8'

services:
  db:
    image: postgres
    platform: linux/amd64
    environment:
      POSTGRES_USER: user
      POSTGRES_PASSWORD: password
      POSTGRES_DB: mydb
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
  auth_service:
    build: ./auth-service
    ports:
     - "8001:8001"
    depends_on:
      - db
  notes_service:
    build: ./notes-service
    ports:
     - "8002:8002"
    depends_on:
      - db
  media_service:
    build: ./media-service
    ports:
     - "8003:8003"
    depends_on:
      - db

  api:
    build: ./api
    ports:
     - "8000:8000"
    depends_on:
      - auth_service
      - notes_service
      - media_service

  # app:
  #   build: .
  #   platform: linux/amd64
  #   depends_on:
  #     - db
  #   ports:
  #     - "8080:8080"
  #   environment:
  #     DB_HOST: db
  #     DB_PORT: 5432
  #     DB_USER: user
  #     DB_PASSWORD: password
